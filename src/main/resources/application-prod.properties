server.port=8098

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

app.certificados.ruta-base=/opt/uploads/certificados

app.storage.tipos.portadas.ruta-base=/opt/uploads/portadas
app.storage.tipos.portadas.url-base=/portadas

app.storage.tipos.logos.ruta-base=/opt/uploads/logos
app.storage.tipos.logos.url-base=/logos

app.storage.tipos.pdfs.ruta-base=/opt/uploads/pdfs
app.storage.tipos.pdfs.url-base=/pdfs

app.storage.tipos.respaldos_encargados.ruta-base=/opt/uploads/respaldos_encargados
app.storage.tipos.respaldos_encargados.url-base=/respaldos_encargados

app.storage.tipos.plantillas_certificado.ruta-base=/opt/uploads/plantillas_certificado
app.storage.tipos.plantillas_certificado.url-base=/plantillas_certificado

app.storage.tipos.firmas_certificado.ruta-base=/opt/firmas_certificado
app.storage.tipos.firmas_certificado.url-base=/firmas_certificado

app.storage.tipos.sellos_certificado.ruta-base=/opt/sellos_certificado
app.storage.tipos.sellos_certificado.url-base=/sellos_certificado

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.task.scheduling.pool.size=3

spring.jackson.time-zone=America/La_Paz
app.certificados.url-verificacion-base=http://localhost:80/validar
# server.error.include-message=always
# server.error.include-binding-errors=always


# Dimensiones de imágenes en el certificado (en EMU: 360000 = 1cm)
app.certificados.imagen.firma.ancho=2160000
app.certificados.imagen.firma.alto=1080000

app.certificados.imagen.sello.ancho=1800000
app.certificados.imagen.sello.alto=1800000

app.certificados.imagen.qr.ancho=900000 
app.certificados.imagen.qr.alto=900000 

# Reducir los mensajes de docx4j
logging.level.org.docx4j=WARN

# Reducir los mensajes de Apache FOP
logging.level.org.apache.fop=WARN
