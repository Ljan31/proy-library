server.port=8098

spring.datasource.url=jdbc:postgresql://localhost:5432/db_proy_library
spring.datasource.username=postgres
spring.datasource.password=123456

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=ESTA_CLAVE_DEBE_TENER_MINIMO_32_CARACTERES
app.jwt.expiration=86400000

app.certificados.ruta-base=../uploads/certificados

app.storage.tipos.portadas.ruta-base=../uploads/portadas
app.storage.tipos.portadas.url-base=/portadas

app.storage.tipos.logos.ruta-base=../uploads/logos
app.storage.tipos.logos.url-base=/logos

app.storage.tipos.pdfs.ruta-base=../uploads/pdfs
app.storage.tipos.pdfs.url-base=/pdfs

app.storage.tipos.respaldos_encargados.ruta-base=../uploads/respaldos_encargados
app.storage.tipos.respaldos_encargados.url-base=/respaldos_encargados

app.storage.tipos.plantillas_certificado.ruta-base=../uploads/plantillas_certificado
app.storage.tipos.plantillas_certificado.url-base=/plantillas_certificado

app.storage.tipos.firmas_certificado.ruta-base=../uploads/firmas_certificado
app.storage.tipos.firmas_certificado.url-base=/firmas_certificado

app.storage.tipos.sellos_certificado.ruta-base=../uploads/sellos_certificado
app.storage.tipos.sellos_certificado.url-base=/sellos_certificado

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.task.scheduling.pool.size=3

spring.jackson.time-zone=America/La_Paz

# Reducir los mensajes de docx4j
logging.level.org.docx4j=WARN

# Reducir los mensajes de Apache FOP
logging.level.org.apache.fop=WARN
logging.level.org.docx4j=ERROR
logging.level.org.apache.fop=ERROR

