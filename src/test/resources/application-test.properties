# ============================================================
# Perfil "test": BD en memoria (H2 en modo PostgreSQL), sin Flyway.
# Se activa con @ActiveProfiles("test") en las pruebas de integración.
# ============================================================
spring.datasource.url=jdbc:h2:mem:library_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# spring.datasource.url=jdbc:postgresql://localhost:5432/library_test
# spring.datasource.username=postgres
# spring.datasource.password=123456
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=validate

# El esquema de pruebas lo genera Hibernate; las migraciones son de PostgreSQL
spring.flyway.enabled=true

# JWT
app.jwt.secret=CLAVE_DE_PRUEBAS_CON_MAS_DE_32_CARACTERES_123456
app.jwt.expiration=3600000

# Archivos: carpeta temporal, nunca las rutas reales
app.certificados.ruta-base=${java.io.tmpdir}/library-test/certificados
app.certificados.url-verificacion-base=http://localhost/certificados
app.storage.tipos.portadas.ruta-base=${java.io.tmpdir}/library-test/portadas
app.storage.tipos.portadas.url-base=/portadas
app.storage.tipos.logos.ruta-base=${java.io.tmpdir}/library-test/logos
app.storage.tipos.logos.url-base=/logos
app.storage.tipos.pdfs.ruta-base=${java.io.tmpdir}/library-test/pdfs
app.storage.tipos.pdfs.url-base=/pdfs
app.storage.tipos.respaldos_encargados.ruta-base=${java.io.tmpdir}/library-test/respaldos
app.storage.tipos.respaldos_encargados.url-base=/respaldos_encargados
app.storage.tipos.plantillas_certificado.ruta-base=${java.io.tmpdir}/library-test/plantillas
app.storage.tipos.plantillas_certificado.url-base=/plantillas_certificado
app.storage.tipos.firmas_certificado.ruta-base=${java.io.tmpdir}/library-test/firmas
app.storage.tipos.firmas_certificado.url-base=/firmas_certificado
app.storage.tipos.sellos_certificado.ruta-base=${java.io.tmpdir}/library-test/sellos
app.storage.tipos.sellos_certificado.url-base=/sellos_certificado
app.certificados.imagen.firma.ancho=2160000
app.certificados.imagen.firma.alto=1080000
app.certificados.imagen.sello.ancho=1800000
app.certificados.imagen.sello.alto=1800000
app.certificados.imagen.qr.ancho=900000
app.certificados.imagen.qr.alto=900000

# Tareas programadas desactivadas ("-" = nunca se ejecutan)
app.scheduling.reservas.expirar=-
app.scheduling.reservas.detectar-disponibles=-
app.scheduling.prestamos.marcar-vencidos=-
app.scheduling.prestamos.notificar-por-vencer=-
app.scheduling.certificados.actualizar-vencidos=-
app.scheduling.sanciones.actualizar-multas=-
app.scheduling.sanciones.cerrar-suspensiones=-
app.scheduling.sanciones.generar-sanciones=-

logging.level.org.docx4j=WARN
logging.level.org.apache.fop=WARN
